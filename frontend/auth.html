<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CineBook</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<nav class="navbar">
  <a href="/" class="logo">Cine<span>Book</span></a>
  <div class="nav-links" id="nav-links"></div>
</nav>

<div class="container">
  <div class="auth-box">
    <!-- Tab switcher -->
    <div style="display:flex;border-bottom:1px solid var(--border);margin-bottom:1.5rem">
      <button id="tabLogin"    onclick="showTab('login')"
              style="flex:1;padding:0.7rem;background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;border-bottom:2px solid var(--accent)">
        Login
      </button>
      <button id="tabRegister" onclick="showTab('register')"
              style="flex:1;padding:0.7rem;background:none;border:none;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent">
        Register
      </button>
    </div>

    <div id="msgArea"></div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
      <p class="text-muted text-center mt-2" style="font-size:0.85rem">
        Demo: <code>alice@example.com</code> / <code>password123</code>
      </p>
    </form>

    <!-- Register Form -->
    <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" id="regName" placeholder="John Doe" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="you@example.com" required>
      </div>
      <div class="form-group">
        <label>Phone (optional)</label>
        <input type="tel" id="regPhone" placeholder="9876543210">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Min 6 characters" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  // Pre-fill mode from URL param
  const mode = new URLSearchParams(window.location.search).get('mode');
  if (mode === 'register') showTab('register');

  function showTab(tab) {
    const isLogin = tab === 'login';
    document.getElementById('loginForm').style.display    = isLogin ? '' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
    document.getElementById('tabLogin').style.color       = isLogin ? 'var(--accent)' : 'var(--text-muted)';
    document.getElementById('tabRegister').style.color    = isLogin ? 'var(--text-muted)' : 'var(--accent)';
    document.getElementById('tabLogin').style.borderBottomColor    = isLogin ? 'var(--accent)' : 'transparent';
    document.getElementById('tabRegister').style.borderBottomColor = isLogin ? 'transparent' : 'var(--accent)';
    document.getElementById('msgArea').innerHTML = '';
  }

  function showMsg(msg, type) {
    document.getElementById('msgArea').innerHTML =
      `<div class="alert alert-${type}">${msg}</div>`;
  }

  async function handleLogin(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Logging in...';
    try {
      const { token, user } = await api.post('/auth/login', {
        email:    document.getElementById('loginEmail').value,
        password: document.getElementById('loginPassword').value
      });
      setAuth(token, user);
      // Redirect to where user came from, or home
      const redirect = new URLSearchParams(window.location.search).get('redirect')
                    || localStorage.getItem('redirect_after_login')
                    || '/';
      localStorage.removeItem('redirect_after_login');
      window.location.href = redirect;
    } catch (err) {
      showMsg(err.message, 'error');
      btn.disabled = false; btn.textContent = 'Login';
    }
  }

  async function handleRegister(e) {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'Creating account...';
    try {
      const { token, user } = await api.post('/auth/register', {
        name:     document.getElementById('regName').value,
        email:    document.getElementById('regEmail').value,
        phone:    document.getElementById('regPhone').value || undefined,
        password: document.getElementById('regPassword').value
      });
      setAuth(token, user);
      window.location.href = '/';
    } catch (err) {
      showMsg(err.message, 'error');
      btn.disabled = false; btn.textContent = 'Create Account';
    }
  }
</script>
</body>
</html>
