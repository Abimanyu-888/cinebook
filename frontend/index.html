<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineBook — Movie Tickets</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar">
  <a href="/" class="logo">Cine<span>Book</span></a>
  <div class="nav-links" id="nav-links"></div>
</nav>

<div class="container">
  <div class="page-header">
    <h1>Now Showing</h1>
    <p>Book tickets for the latest movies</p>
  </div>

  <!-- Search & Filter -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search movies..." />
    <select id="genreFilter">
      <option value="">All Genres</option>
    </select>
    <button class="btn btn-primary" onclick="loadMovies()">Search</button>
  </div>

  <!-- Movies Grid -->
  <div id="moviesGrid" class="movies-grid">
    <div class="spinner"></div>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
  async function loadGenres() {
    try {
      const genres = await api.get('/movies/genres');
      const sel = document.getElementById('genreFilter');
      genres.forEach(g => {
        const opt = document.createElement('option');
        opt.value = g; opt.textContent = g;
        sel.appendChild(opt);
      });
    } catch {}
  }

  async function loadMovies() {
    const search = document.getElementById('searchInput').value.trim();
    const genre  = document.getElementById('genreFilter').value;
    const grid   = document.getElementById('moviesGrid');

    grid.innerHTML = '<div class="spinner"></div>';

    let path = '/movies?';
    if (search) path += `search=${encodeURIComponent(search)}&`;
    if (genre)  path += `genre=${encodeURIComponent(genre)}`;

    try {
      const movies = await api.get(path);
      if (movies.length === 0) {
        grid.innerHTML = '<p class="text-muted text-center" style="grid-column:1/-1;margin-top:2rem">No movies found.</p>';
        return;
      }
      grid.innerHTML = movies.map(m => `
        <a href="/movie.html?id=${m.movie_id}" class="card movie-card" style="display:block;color:inherit;text-decoration:none">
          <img src="${m.poster_url || 'https://via.placeholder.com/300x450/1a1a2e/eaeaea?text=No+Poster'}"
               alt="${m.title}" loading="lazy"
               onerror="this.src='https://via.placeholder.com/300x450/1a1a2e/eaeaea?text=No+Poster'">
          <div class="card-body">
            <h3>${m.title}</h3>
            <div class="meta">
              ${m.genre ? `<span class="badge">${m.genre}</span>` : ''}
              ${m.rating ? `<span class="badge badge-warning">⭐ ${m.rating}</span>` : ''}
              <span class="badge">${m.duration} min</span>
            </div>
            <button class="btn btn-primary" style="width:100%;font-size:0.85rem">Book Tickets</button>
          </div>
        </a>
      `).join('');
    } catch (err) {
      grid.innerHTML = `<p class="alert alert-error" style="grid-column:1/-1">${err.message}</p>`;
    }
  }

  // Search on Enter key
  document.getElementById('searchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') loadMovies();
  });

  loadGenres();
  loadMovies();
</script>
</body>
</html>
